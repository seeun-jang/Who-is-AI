<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="js/waiting-modal.js" defer></script>
    <link rel="stylesheet" href="css/waiting-modal.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Is AI - Game</title>

    <link rel="stylesheet" href="css/game.css">
    <script src="js/game.js" defer></script>
</head>
<body>

    <main class="game-page">

        <!-- 상단 왼쪽 제시어 표시 -->
        <div class="topic-board">
            <span>제시어</span>
            <strong id="topicHeaderText">프랑스</strong>
        </div>

        <!-- 처음 뜨는 제시어 모달 -->
        <div id="topicModal" class="modal-overlay">
            <div class="topic-modal">
                <h2>제시어 공개</h2>
                <p>이번 라운드 제시어</p>
                <strong id="topicText">제시어 불러오는 중...</strong>
                <button id="topicConfirmBtn">확인</button>
            </div>
        </div>

        <!-- 말풍선 -->
        <div class="speech-bubble bubble-1">
            <div class="bubble-header">Player 1</div>
            <div class="bubble-body">프랑스는 빵이 유명해.</div>
        </div>
        <div class="speech-bubble bubble-2">
            <div class="bubble-header">Player 2</div>
            <div class="bubble-body">사용하는 언어는 불어를 써.</div>
        </div>
        <div class="speech-bubble bubble-3">
            <div class="bubble-header">Player 3</div>
            <div class="bubble-body">프랑스의 수도는 파리야.</div>
        </div>
        <div class="speech-bubble bubble-4">
            <div class="bubble-header">Player 4</div>
            <div class="bubble-body">'라따뚜이'라는 영화의 배경이야.</div>
        </div>
        <div class="speech-bubble bubble-5">
            <div class="bubble-header">Player 5</div>
            <div class="bubble-body">화폐단위는 유로야.</div>
        </div>

        <!-- 플레이어 이름표 -->
        <div class="player-tag player-1">Player 1</div>
        <div class="player-tag player-2">Player 2</div>
        <div class="player-tag player-3">Player 3</div>
        <div class="player-tag player-4">Player 4</div>
        <div class="player-tag player-5">Player 5</div>

        <!-- 채팅 입력창 -->
        <section class="chat-bar">
            <input type="text" id="chatInput" placeholder="메시지를 입력하세요...">
            <button id="sendBtn">➤</button>
        </section>
     <!-- 대기 화면 -->
        <div id="waitingModal" class="waiting-overlay hidden">
        <aside class="waiting-panel">
        <span class="waiting-label">SPECTATOR MODE</span>

        <h2>대기 중</h2>

        <p>
            현재 게임이 진행 중입니다.
        </p>

        <p>
            다음 순서로 입장할 때까지<br>
            진행 중인 게임을 관전합니다.
        </p>

        <div class="waiting-status">
            WATCHING GAME...
        </div>
        </aside>
        </div>

    </main>

</body>
</html>
